<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EE Calc">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://archive.org https://*.archive.org; media-src 'self' https:; connect-src 'self' https://archive.org wss://broker.emqx.io:8084 wss://broker.hivemq.com:8884 wss://test.mosquitto.org:8081; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>EE Calc</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #000; --text: #e6e6e6; --muted: #8a8a8a; --amber: #f0b44c; --err: #ff7b6b;
  --line: #2e2e2e; --key: #4a4a4a; --field: #5c5c5c; --accentline: #8a6a2e; --press: #1a1a1a; --sel: #1d2b40;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ui: system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --keyh: clamp(40px, 6.1vh, 58px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--ui);
  -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

/* ── top bar ── */
#top { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 6px; border-bottom: 1px solid var(--line); min-height: 52px; }
#menu-btn { display: flex; align-items: center; gap: 10px; padding: 0 10px; min-height: 44px; border-radius: 10px; font-size: 17px; font-weight: 600; flex: 1; text-align: left; min-width: 0; }
#menu-btn .ic { color: var(--amber); width: 24px; height: 24px; }
#menu-btn #title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); flex: none; }
#to-calc { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text); border: 1px solid var(--key); border-radius: 12px; flex: none; }

/* ── views ── */
#views { position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

/* calculator */
#history { flex: 1; padding: 10px 16px 4px; font-family: var(--mono); }
.entry { padding: 6px 0 8px; }
.entry .in { font-size: 14px; color: var(--muted); white-space: pre; overflow-x: auto; padding: 2px 0; }
.entry .out { font-size: 20px; white-space: pre; overflow-x: auto; padding: 2px 0; line-height: 1.3; }
.entry .alt { color: var(--amber); }
.entry .name { color: var(--muted); }
.entry .note { font-size: 14px; color: var(--muted); font-family: var(--ui); }
.hint { color: var(--muted); font-size: 15px; line-height: 1.55; font-family: var(--ui); white-space: pre-line; padding-top: 8px; }
.hint code { font-family: var(--mono); color: var(--text); }
#preview { min-height: 24px; padding: 2px 18px; font: 14px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#preview.err { color: var(--err); }
.editor { font-family: var(--mono); white-space: pre; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; cursor: text; }
.editor::-webkit-scrollbar { display: none; }
.editor .caret { display: inline-block; width: 2px; margin: 0 -1px; background: var(--amber); vertical-align: text-bottom; height: 1.15em; animation: blink 1.05s steps(1) 6; }
.editor:not(.active) .caret { visibility: hidden; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes blink2 { 50% { opacity: 0; } }
#expr { margin: 2px 12px 0; padding: 10px 12px; font-size: 26px; min-height: 54px; border: 1px solid var(--field); border-radius: 12px; }
#bar { display: flex; align-items: center; gap: 4px; padding: 4px 10px 0; }
#bar button { font-size: 15px; color: var(--muted); padding: 0 10px; min-height: 44px; border-radius: 10px; }
#bar .grow { flex: 1; }

/* energy */
.list { padding: 4px 16px 20px; }
.group { display: flex; align-items: center; gap: 8px; font: 600 14px var(--ui); color: var(--muted); margin: 20px 4px 8px; }
.group .ic { width: 20px; height: 20px; }
.tool { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--key); margin-bottom: 8px; }
.tool b { display: block; font-size: 17px; font-weight: 500; margin-bottom: 3px; }
.tool span { font-size: 14px; color: var(--muted); line-height: 1.4; }
.back { display: flex; align-items: center; gap: 4px; font-size: 16px; color: var(--muted); min-height: 44px; padding: 0 12px; text-align: left; }
.back .ic { width: 20px; height: 20px; }
.page h2 { margin: 2px 16px 4px; font-size: 22px; font-weight: 600; }
.page p.desc { margin: 0 16px 10px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.page p.desc.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.more { color: var(--amber); font-size: 14px; margin: -6px 16px 10px; min-height: 32px; }
.fields { padding: 0 16px; display: grid; grid-template-columns: minmax(96px, auto) minmax(0, 1fr) 44px; gap: 6px 8px; align-items: center; }
.fields label { font-size: 15px; }
.fields label small { color: var(--muted); font-size: 13px; margin-left: 4px; }
.fields .editor { font-size: 18px; padding: 8px 10px; min-height: 44px; border: 1px solid var(--field); border-radius: 10px; }
.fields .editor.active { border-color: var(--amber); }
.fields .unit { font-size: 14px; color: var(--muted); }
.results { margin: 12px 16px 16px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--mono); }
.res { display: grid; grid-template-columns: minmax(64px, auto) minmax(0, 1fr); gap: 0 12px; padding: 5px 0; }
.res .rk { color: var(--muted); font-size: 15px; }
.res .v { font-size: 17px; white-space: pre; overflow-x: auto; }
.res .v .alt { color: var(--amber); }
.res .v .note { color: var(--muted); font: 13px var(--ui); margin-left: 8px; }
.results .msg { font: 14px var(--ui); color: var(--muted); }
.fields .seg { grid-column: 2 / 4; margin: 0; }
.results .rh { font: 600 14px var(--ui); color: var(--muted); margin: 12px 0 2px; }
.rtab { overflow-x: auto; margin: 12px 0 8px; }
.rtab table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rtab th { font: 13px var(--ui); color: var(--muted); text-align: right; padding: 4px 0 6px 12px; white-space: nowrap; }
.rtab th small { display: block; font-size: 12px; }
.rtab td { font-size: 14px; text-align: right; padding: 5px 0 5px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
.rtab th:first-child, .rtab td:first-child { padding-left: 0; }
.results .msg.err { color: var(--err); }

/* variables / help */
.vars { padding: 8px 16px 20px; font-family: var(--mono); }
.var { padding: 10px 4px; border-bottom: 1px solid var(--line); }
.var b { display: block; font: 600 15px var(--ui); margin-bottom: 2px; }
.var div { font-size: 16px; white-space: pre; overflow-x: auto; }
.var .alt { color: var(--amber); }
.wide { display: block; margin: 16px auto 0; padding: 0 18px; min-height: 44px; border: 1px solid var(--key); border-radius: 10px; color: var(--muted); font: 15px var(--ui); }
.help { padding: 6px 16px 30px; font: 15px/1.5 var(--ui); -webkit-user-select: text; user-select: text; }
.help h3 { font: 600 17px var(--ui); color: var(--amber); margin: 24px 0 6px; }
.help p { margin: 0 0 8px; white-space: pre-line; }
.help dl { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 4px 14px; margin: 0 0 10px; }
.help dt { font: 14px/1.5 var(--mono); color: var(--text); overflow-wrap: anywhere; }
.help dd { margin: 0; color: var(--muted); }
.help code { font: 14px var(--mono); color: var(--text); }

/* ── keypad ── */
#pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 8px 10px 8px; }
.k { height: var(--keyh); border-radius: 12px; border: 1px solid var(--key); font-size: 21px; display: flex; align-items: center; justify-content: center; }
.k.fnk { font-size: 16px; }
.k.op { color: var(--amber); }
.k.muted { color: var(--muted); font-size: 16px; }
.k.exe { color: #000; background: var(--amber); border-color: var(--amber); font-weight: 600; }
.k.on { border-color: var(--amber); color: var(--amber); }
.k.down { background: var(--press); }
.k.exe.down { filter: brightness(.8); }
body.kbd #pad { display: none; }

/* ── sheets, toast ── */
#sheet { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
#sheet .box { width: min(100%, 560px); max-height: 78%; background: #000; border: 1px solid var(--key); border-bottom: 0; border-radius: 16px 16px 0 0;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); overflow-y: auto; }
#sheet .box h4 { margin: 6px 6px 8px; font-size: 14px; color: var(--muted); font-weight: 500; }
#sheet .act { display: block; width: 100%; text-align: left; padding: 0 12px; min-height: 50px; font-size: 17px; border-bottom: 1px solid var(--line); }
#sheet .act:last-child { border-bottom: 0; }
#sheet .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-bottom: 8px; }
#sheet .grid button { padding: 10px 4px; border: 1px solid var(--key); border-radius: 10px; font: 15px var(--mono); }
#toast { position: fixed; left: 50%; bottom: calc(40% + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 8px 14px;
  border: 1px solid var(--key); border-radius: 18px; background: #000; font-size: 14px; z-index: 20; pointer-events: none; }
#install { margin: 8px 12px 0; padding: 10px 12px; border: 1px solid var(--key); border-radius: 12px; font-size: 13px; color: var(--muted); line-height: 1.4; }
#install button { float: right; color: var(--text); padding: 0 0 4px 12px; font-size: 15px; }
#sysin { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; }

/* ── menu ── */
#sheet .menu { padding-top: 6px; }
#sheet .menu .mi { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 54px; padding: 0 14px; font-size: 17px; border-radius: 12px; }
#sheet .menu .mi .ic { color: var(--muted); }
#sheet .menu .mi .ml { flex: 1; min-width: 0; }
#sheet .menu .mi small { color: var(--muted); font-size: 14px; white-space: nowrap; }
#sheet .menu .mi .chev { width: 18px; height: 18px; }
#sheet .menu .mi.cur { background: #111; }
#sheet .menu .mi.cur .ml, #sheet .menu .mi.cur .ic { color: var(--amber); }
#sheet .menu .mi:active { background: var(--press); }
#sheet .menu .mi.sub { min-height: 46px; padding-left: 50px; font-size: 16px; color: #cfcfcf; }
#sheet .menu .mi.locked { color: var(--muted); }
#sheet .menu .sep { height: 1px; background: var(--line); margin: 6px 14px; }
#sheet .menu .mh { font: 600 13px var(--ui); color: var(--muted); padding: 14px 14px 4px 50px; }
#sheet .act.danger { color: var(--err); }
#sheet .act.muted { color: var(--muted); }
#sheet .grid button.on { border-color: var(--amber); color: var(--amber); }
#sheet .fullval { font: 15px var(--mono); white-space: pre-wrap; word-break: break-all; padding: 4px 8px 10px; color: var(--text); -webkit-user-select: text; user-select: text; }
.pad16 { padding: 16px; }

/* ── network ── */
#v-net { display: flex; flex-direction: column; }
.nscroll { flex: 1; min-height: 0; padding: 8px 12px 16px; }
.nscroll.casemode { display: flex; flex-direction: column; overflow: hidden; }
.nhead { display: flex; align-items: center; gap: 10px; margin: 2px 2px 6px; }
.casename { font-size: 19px; font-weight: 600; text-align: left; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 13px; color: var(--muted); border: 1px solid var(--key); border-radius: 8px; padding: 3px 8px; flex: none; }
.badge.warn { color: var(--amber); border-color: var(--accentline); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--key); border-radius: 10px; font-size: 15px; }
.btn .ic { width: 20px; height: 20px; }
.btn.accent { color: var(--amber); border-color: var(--accentline); }
.btn.big { display: flex; width: 100%; min-height: 52px; font-size: 17px; margin: 8px 0; }
.btn.wide2 { display: flex; width: 100%; margin: 8px 0; color: var(--muted); }
.btn:disabled { opacity: .4; }
.chip { min-height: 38px; padding: 0 13px; border: 1px solid var(--key); border-radius: 19px; font-size: 14px; color: var(--muted); }
.link { color: var(--amber); font-size: inherit; }
.caseinfo { font-size: 14px; color: var(--muted); margin: 2px 2px 8px; }
.seg { display: flex; border: 1px solid var(--key); border-radius: 10px; overflow-x: auto; scrollbar-width: none; margin: 6px 0; flex: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; min-height: 44px; padding: 0 12px; font-size: 15px; color: var(--muted); border-right: 1px solid var(--key); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on { color: var(--amber); background: #141414; font-weight: 600; }
.opts { margin-bottom: 4px; }
.tw { overflow: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; max-height: 70vh; overscroll-behavior: contain; }
.casemode .tw { flex: 1; min-height: 120px; max-height: none; }
table.grid { border-collapse: separate; border-spacing: 0; font: 14px var(--mono); }
table.grid th { position: sticky; top: 0; background: #000; color: var(--muted); font: 600 13px var(--ui); text-align: left; padding: 8px 10px;
  border-bottom: 1px solid var(--key); white-space: nowrap; z-index: 2; }
table.grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; min-width: 44px; }
table.grid td.n { text-align: right; }
table.grid td:first-child, table.grid th:first-child { position: sticky; left: 0; background: #000; z-index: 1; border-right: 1px solid var(--line); }
table.grid th:first-child { z-index: 3; }
table.grid td.bad { color: var(--err); }
table.grid td.good { color: #7fbf7f; }
table.grid td.off { color: var(--muted); }
table.grid td.editing { outline: 1px solid var(--amber); outline-offset: -1px; }
.mini { font-size: 13px; color: var(--muted); margin: 6px 2px; line-height: 1.45; }
.status { font-size: 14px; margin: 8px 2px; color: var(--muted); }
.status.ok { color: var(--text); }
.issues { font-size: 14px; color: var(--err); border: 1px solid #4a2020; border-radius: 10px; padding: 10px 12px; margin: 8px 0; line-height: 1.5; }
.issues.warnbox { color: var(--amber); border-color: var(--accentline); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 8px 2px; font-size: 15px; }
.kv .kk { color: var(--muted); }
.kv .vv { font-family: var(--mono); white-space: pre; overflow-x: auto; }
.kv .vv.tap { color: var(--text); }
.celledit { border-top: 1px solid var(--key); padding: 8px 12px 4px; }
.celllabel { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.cellrow { display: flex; gap: 8px; align-items: center; }
.cellval { flex: 1; font-size: 20px; padding: 8px 10px; border: 1px solid var(--amber); border-radius: 10px; min-height: 44px; }
.cellbtn { width: 44px; height: 44px; border: 1px solid var(--key); border-radius: 10px; font-size: 18px; color: var(--amber); }
.cellbtn.muted { color: var(--muted); }

/* ── chat ── */
#v-chat { display: flex; flex-direction: column; }
.chathead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 0; }
.chatstatus { font-size: 14px; color: var(--muted); }
.chatstatus.online { color: #7fbf7f; }
.chatnote { padding: 0 12px; }
.chatlist { flex: 1; min-height: 0; padding: 8px 12px; }
.msg { max-width: 85%; margin: 6px 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 12px; }
.msg.mine { margin-left: auto; border-color: #3a3a3a; }
.msg .who { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.msg.mine .who b { color: var(--amber); }
.msg .txt { font-size: 16px; white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text; }
.chatform { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.chatform input { flex: 1; min-width: 0; font-size: 16px; color: var(--text); background: #000; border: 1px solid var(--field); border-radius: 10px; padding: 10px; }
.chatlock { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 15px; }
.lockicon { display: flex; } .lockicon .ic { width: 40px; height: 40px; }

/* ── iPhone: tool labels on their own row, so the inputs get the full width ── */
@media (max-width: 699px) {
  .fields { grid-template-columns: minmax(0, 1fr) 44px; gap: 4px 8px; }
  .fields label { grid-column: 1 / -1; margin-top: 8px; }
  .fields .seg { grid-column: 1 / -1; }
}

/* ── iPad ── */
@media (min-width: 700px) {
  :root { --keyh: clamp(48px, 6.4vh, 66px); }
  .k { font-size: 24px; } .k.fnk { font-size: 18px; }
  #pad { max-width: 620px; width: 100%; justify-self: center; padding-bottom: 14px; }
  #expr { font-size: 30px; }
  .entry .out { font-size: 22px; }
  #history, .list, .fields, .results, .vars, .help, #preview, #bar { max-width: 900px; width: 100%; margin-left: auto; margin-right: auto; }
  .nscroll { padding: 10px 20px 20px; }
  .chatlist, .chatform, .chathead, .chatnote { max-width: 900px; width: 100%; margin-left: auto; margin-right: auto; }
  #menu-btn { font-size: 19px; }
  .k.muted { font-size: 18px; }
  .fdock .pbar { max-width: 528px; margin: 0 auto; }
  /* the menu as a side panel instead of a sheet over the keypad */
  #sheet:has(> .box.menu) { justify-content: flex-start; align-items: stretch; }
  #sheet .box.menu { width: 380px; max-height: none; border: 0; border-right: 1px solid var(--key); border-radius: 0 16px 16px 0;
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
}
@media (min-width: 700px) and (orientation: portrait) {
  #expr, #preview, #bar { max-width: 620px; width: calc(100% - 24px); margin-left: auto; margin-right: auto; }
}
@media (min-width: 1000px) and (orientation: landscape) {
  #app { grid-template-columns: minmax(0, 1fr) 430px; grid-template-rows: auto minmax(0, 1fr); }
  #top { grid-column: 1 / span 2; }
  #views { grid-column: 1; grid-row: 2; }
  #pad { grid-column: 2; grid-row: 2; align-self: stretch; max-width: none; border-left: 1px solid var(--line);
         grid-auto-rows: minmax(56px, 84px); align-content: end; padding: 12px; }
  .k { height: auto; }
  body.nopad #views { grid-column: 1 / span 2; }
}

#pomo { min-height: 36px; padding: 0 11px; border: 1px solid var(--accentline); border-radius: 18px; font: 15px var(--mono); color: var(--amber); flex: none; }
#pomo.brk { color: var(--muted); border-color: var(--key); }
#sheet .menu .mi .badge { display: inline-block; min-width: 18px; margin-left: 8px; padding: 1px 6px; border-radius: 9px; background: var(--amber); color: #000; font-size: 12px; font-weight: 700; text-align: center; }
.fwrap, .prof { max-width: 560px; margin: 0 auto; padding: 16px; font-family: var(--ui); }
.fclock { font: 300 64px var(--mono); text-align: center; letter-spacing: 1px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
.fclock.run { color: var(--text); }
.fphase { text-align: center; color: var(--muted); font-size: 15px; margin: 4px 0 12px; }
.fbar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 6px 0 14px; }
/* scaleX, no transition: the 1 Hz update is compositor-only (no layout); at 25 min the bar moves ~0.2 px/s anyway */
.fbar > div { height: 100%; background: var(--amber); transform: scaleX(0); transform-origin: left; }
.fh { font: 600 14px var(--ui); color: var(--muted); margin: 24px 0 8px; }
.fvolrow { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0 4px; }
