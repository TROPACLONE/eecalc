<body>
<div id="app">
<header id="top">
<button id="menu-btn" aria-label="Menu"><span class="hamb">☰</span><span id="title">Calculator</span><span id="dot" hidden></span></button>
<button id="to-calc" hidden>Calculator</button>

<main id="views">

<div id="history" class="scroll" aria-live="polite"></div>
<div id="preview"></div>
<div id="expr" class="editor active" role="textbox" aria-label="Expression"></div>
<div id="bar">

<span class="grow"></span><button id="clear-hist" hidden>Clear</button>
</div>
</section>
<section class="view scroll" id="v-energy" hidden></section>
<section class="view" id="v-net" hidden></section>
<section class="view scroll" id="v-vars" hidden></section>
<section class="view" id="v-chat" hidden></section>
<section class="view scroll" id="v-help" hidden></section>
</main>
<div id="pad" role="group" aria-label="Keypad"></div>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input id="sysin" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-hidden="true" tabindex="-1">
